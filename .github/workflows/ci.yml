name: ci

on:
  push:
  pull_request:

jobs:
  changes:
    name: Detect changed ecosystems
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.filter.outputs.rust }}
      python: ${{ steps.filter.outputs.python }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect changed files
        id: filter
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail

          if [[ "${GITHUB_EVENT_NAME}" == "pull_request" ]]; then
            base_ref="origin/${GITHUB_BASE_REF}"
            git fetch --no-tags --prune --depth=1 origin "${GITHUB_BASE_REF}"
            diff_range="${base_ref}...${GITHUB_SHA}"
          else
            if [[ -z "${EVENT_BEFORE:-}" || "${EVENT_BEFORE}" == "0000000000000000000000000000000000000000" ]]; then
              diff_range=""
            else
              diff_range="${EVENT_BEFORE}...${GITHUB_SHA}"
            fi
          fi

          if [[ -n "${diff_range}" ]]; then
            changed_files="$(git diff --name-only "${diff_range}")"
          else
            changed_files="$(git diff-tree --no-commit-id --name-only -r "${GITHUB_SHA}")"
          fi

          rust=false
          python=false
          frontend=false

          if [[ -n "${changed_files}" ]]; then
            if printf '%s\n' "${changed_files}" | grep -Eq '^(Cargo\.toml|Cargo\.lock|crates/backend/|\.github/workflows/ci\.yml|\.github/dependabot\.yml)'; then
              rust=true
            fi

            if printf '%s\n' "${changed_files}" | grep -Eq '^(services/inference-worker/|\.github/workflows/ci\.yml|\.github/dependabot\.yml)'; then
              python=true
            fi

            if printf '%s\n' "${changed_files}" | grep -Eq '^(packages/frontend/|\.github/workflows/ci\.yml|\.github/dependabot\.yml)'; then
              frontend=true
            fi
          fi

          {
            echo "rust=${rust}"
            echo "python=${python}"
            echo "frontend=${frontend}"
          } >> "${GITHUB_OUTPUT}"

  rust:
    name: Rust
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.rust == 'true'
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            crates/backend/target
          key: ${{ runner.os }}-rust-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/backend/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-rust-

      - name: cargo fmt --check
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: cargo test --workspace

  python:
    name: Python
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.python == 'true'
    defaults:
      run:
        working-directory: services/inference-worker
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: services/inference-worker/pyproject.toml

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e . pytest

      - name: pytest
        run: pytest

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    defaults:
      run:
        working-directory: packages/frontend
        shell: bash
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: packages/frontend/pnpm-lock.yaml

      - name: Activate pnpm
        run: corepack prepare pnpm@11.20.0 --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: pnpm test
        run: pnpm test

      - name: pnpm build
        run: pnpm build
