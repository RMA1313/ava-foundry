services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: data_studio
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d data_studio"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    environment:
      DATA_STUDIO_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/data_studio
      DATA_STUDIO_WORKSPACE_DIR: /workspace
      DATA_STUDIO_DATA_DIR: /workspace/data
      DATA_STUDIO_TEMP_DIR: /workspace/data/tmp
      DATA_STUDIO_HOST: 0.0.0.0
      DATA_STUDIO_PORT: 8080
    volumes:
      - .:/workspace
      - cargo-registry:/usr/local/cargo/registry
      - cargo-git:/usr/local/cargo/git
      - cargo-target:/workspace/target
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/health/live && curl -fsS http://127.0.0.1:8080/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    environment:
      VITE_API_BASE_URL: /api
      CI: "true"
      PNPM_CONFIG_CONFIRM_MODULES_PURGE: "false"
    volumes:
      - .:/workspace
      - frontend-node-modules:/workspace/packages/frontend/node_modules
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  inference-worker:
    build:
      context: .
      dockerfile: docker/inference-worker.Dockerfile
    environment:
      DATA_STUDIO_DATABASE_URL: postgresql://postgres:postgres@postgres:5432/data_studio
      DATA_STUDIO_WORKSPACE_DIR: /workspace
      DATA_STUDIO_DATA_DIR: /workspace/data
      DATA_STUDIO_TEMP_DIR: /workspace/data/tmp
      DATA_STUDIO_INFERENCE_HOST: 0.0.0.0
      DATA_STUDIO_INFERENCE_PORT: 8090
    volumes:
      - .:/workspace
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8090:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8090/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  cargo-registry:
  cargo-git:
  cargo-target:
  frontend-node-modules:
